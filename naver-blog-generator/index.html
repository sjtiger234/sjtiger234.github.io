<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 블로그 포스팅 생성기 — 맛집·여행·공연 후기</title>
<meta name="description" content="사진과 핵심 내용만 입력하면 제목·목차·소제목·본문·총평·태그 순서로 사진 배치까지 자동 구성된 네이버 블로그 포스팅 초안을 만들어줍니다.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="tool-header">
  <div class="tool-header-inner">
    <a class="tool-brand" href="../index.html">← 홈으로</a>
    <h1>네이버 블로그 포스팅 생성기</h1>
    <p class="tool-sub">사진과 핵심 내용만 넣으면 제목 · 목차 · 소제목 · 본문 · 총평 · 태그까지, 사진 배치 위치와 함께 완성해드려요.</p>
  </div>
</header>

<div class="mobile-tabs">
  <button type="button" id="mobileTabForm" class="mobile-tab active">✏️ 입력</button>
  <button type="button" id="mobileTabPreview" class="mobile-tab">👀 미리보기</button>
</div>

<main class="layout">

  <!-- ================= 입력 패널 ================= -->
  <section class="panel form-panel" id="formPanel">

    <div class="field-group">
      <label class="field-label">카테고리</label>
      <div class="category-tabs">
        <label class="category-tab">
          <input type="radio" name="category" value="food" checked>
          <span>🍽️ 맛집 후기</span>
        </label>
        <label class="category-tab">
          <input type="radio" name="category" value="travel">
          <span>✈️ 여행 후기</span>
        </label>
        <label class="category-tab">
          <input type="radio" name="category" value="show">
          <span>🎭 공연 후기</span>
        </label>
      </div>
    </div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label" for="placeInput">상호명 / 장소명</label>
        <input type="text" id="placeInput" placeholder="예) 을지로 화로구이">
      </div>
      <div class="field-group">
        <label class="field-label" for="regionInput">지역</label>
        <input type="text" id="regionInput" placeholder="예) 서울 을지로">
      </div>
    </div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label" for="dateInput">방문일</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field-group">
        <label class="field-label" for="companionInput">함께한 사람</label>
        <input type="text" id="companionInput" placeholder="예) 친구와, 가족과, 혼자">
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">평점</label>
      <div class="star-picker">
        <button type="button" class="star-btn" data-star="1">★</button>
        <button type="button" class="star-btn" data-star="2">★</button>
        <button type="button" class="star-btn" data-star="3">★</button>
        <button type="button" class="star-btn" data-star="4">★</button>
        <button type="button" class="star-btn" data-star="5">★</button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="keywordsInput">핵심 키워드 (쉼표로 구분, 검색 노출용)</label>
      <input type="text" id="keywordsInput" placeholder="예) 노포 감성, 숯불구이, 가성비">
    </div>

    <div class="field-group">
      <div class="field-label-row">
        <label class="field-label">소제목 & 사진</label>
        <button type="button" id="addSectionBtn" class="btn-secondary small">+ 소제목 추가</button>
      </div>
      <div id="sectionsList"></div>
    </div>

    <div class="field-group">
      <label class="field-label" for="summaryInput">총평 메모 (선택, 한 줄씩)</label>
      <textarea id="summaryInput" rows="3" placeholder="예) 가격 대비 만족도 높음&#10;재방문 의사 있음"></textarea>
    </div>

    <div class="field-group">
      <label class="field-label" for="extraTagsInput">추가 태그 (선택, 쉼표로 구분)</label>
      <input type="text" id="extraTagsInput" placeholder="예) 을지로맛집, 노포">
    </div>

    <div class="action-row">
      <button type="button" id="exampleBtn" class="btn-secondary">예시로 채워보기</button>
      <button type="button" id="resetBtn" class="btn-secondary">전체 초기화</button>
      <button type="button" id="generateBtn" class="btn-primary">✨ 포스팅 생성하기</button>
    </div>
    <p class="privacy-note">사진과 입력 내용은 서버로 전송되지 않고, 이 브라우저 안에서만 처리돼요. (사진은 새로고침 시 사라지므로 완성 후 내보내기를 먼저 해주세요)</p>

  </section>

  <!-- ================= 미리보기 패널 ================= -->
  <section class="panel preview-panel" id="previewPanel">
    <div class="preview-toolbar">
      <button type="button" id="copyRichBtn" class="btn-primary">📋 사진 포함 복사</button>
      <button type="button" id="copyPlainBtn" class="btn-secondary">텍스트만 복사</button>
      <button type="button" id="downloadBtn" class="btn-secondary">HTML로 저장</button>
    </div>
    <div id="statusMsg" class="status-msg"></div>
    <article id="previewArticle" class="preview-article"></article>
  </section>

</main>

<footer class="tool-footer">
  <p>이 도구는 입력하신 메모를 자연스러운 문장으로 다듬고, 사진을 본문 흐름에 맞게 배치해주는 보조 도구예요. 생성된 글은 붙여넣기 전에 한 번 더 읽어보고 다듬어 주세요.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
